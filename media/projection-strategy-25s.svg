<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="76%"><stop offset="0" stop-color="#ffffff"/><stop offset=".74" stop-color="#f8fbff"/><stop offset="1" stop-color="#eff5ff"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2457F5" opacity=".10"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#183570" flood-opacity=".10"/></filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#2457F5"/></marker>
    <marker id="yellowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#F4B740"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#E5484D"/></marker>
    <style>
      text{font-family:Inter,"Noto Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;fill:#12213f}
      .eye{font-size:18px;font-weight:760;letter-spacing:3px;fill:#2457F5}.title{font-size:46px;font-weight:820}.h2{font-size:28px;font-weight:780}.h3{font-size:23px;font-weight:760}.body{font-size:20px;fill:#5b6780}.small{font-size:17px;fill:#73809a}.tiny{font-size:14px;fill:#8b96aa}.num{font-family:Inter,sans-serif;font-weight:850}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/><rect width="1920" height="1080" fill="url(#dots)"/>
  <circle cx="1640" cy="110" r="250" fill="#2457F5" opacity=".035"/>
  <g opacity="0"><animate attributeName="opacity" dur=".4s" to="1" fill="freeze"/><text x="88" y="72" class="eye">DATA TO INSIGHT · TALENT FUTURE</text><text x="1832" y="72" text-anchor="end" class="tiny">PRODUCT STRATEGY · 24.5s</text></g>

  <!-- 第一幕 0—9.5s：从两套事实到统一投影 -->
  <g id="scene1" opacity="0">
    <animate attributeName="opacity" begin="0s" dur=".45s" to="1" fill="freeze"/>
    <animate attributeName="opacity" begin="9.15s" dur=".35s" to="0" fill="freeze"/>
    <text x="88" y="145" class="title">① 信息如何投影到同一把尺子？</text>
    <text x="88" y="184" class="body">先保留两套事实入口，再翻译成可比较的能力坐标</text>

    <!-- 来源卡 -->
    <g opacity="0"><animate attributeName="opacity" begin=".45s" dur=".45s" to="1" fill="freeze"/>
      <g transform="translate(88 252)" filter="url(#shadow)"><rect width="370" height="252" rx="30" fill="#fff" stroke="#eef1f5"/><rect x="28" y="26" width="100" height="34" rx="17" fill="#eaf0ff"/><text x="78" y="49" text-anchor="middle" class="tiny" fill="#2457F5">人像标签</text><text x="28" y="104" class="h2">候选人事实</text><text x="28" y="138" class="small">教育 · 实习 · 技能 · 获奖</text><g transform="translate(28 170)"><rect width="92" height="42" rx="21" fill="#f4f6fa"/><text x="46" y="27" text-anchor="middle" class="small">项目</text><rect x="104" width="110" height="42" rx="21" fill="#f4f6fa"/><text x="159" y="27" text-anchor="middle" class="small">跨组协作</text><rect x="226" width="92" height="42" rx="21" fill="#f4f6fa"/><text x="272" y="27" text-anchor="middle" class="small">技能</text></g></g>
      <g transform="translate(1462 252)" filter="url(#shadow)"><rect width="370" height="252" rx="30" fill="#fff" stroke="#eef1f5"/><rect x="28" y="26" width="100" height="34" rx="17" fill="#fff6dc"/><text x="78" y="49" text-anchor="middle" class="tiny" fill="#B97900">岗位标签</text><text x="28" y="104" class="h2">岗位事实</text><text x="28" y="138" class="small">行业 × 岗位 × JD</text><g transform="translate(28 170)"><rect width="100" height="42" rx="21" fill="#f4f6fa"/><text x="50" y="27" text-anchor="middle" class="small">数据分析</text><rect x="112" width="110" height="42" rx="21" fill="#f4f6fa"/><text x="167" y="27" text-anchor="middle" class="small">业务理解</text><rect x="234" width="76" height="42" rx="21" fill="#fff6dc"/><text x="272" y="27" text-anchor="middle" class="small" fill="#B97900">JD</text></g></g>
    </g>

    <!-- 来源到坐标系的箭头 -->
    <g opacity="0"><animate attributeName="opacity" begin="1.8s" dur=".35s" to="1" fill="freeze"/>
      <path d="M458 392C590 430 660 475 740 542" fill="none" stroke="#2457F5" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#blueArrow)"/>
      <path d="M1462 392C1330 430 1260 475 1180 542" fill="none" stroke="#F4B740" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#yellowArrow)"/>
      <circle r="8" fill="#2457F5"><animateMotion begin="1.9s" dur="1.3s" path="M458 392C590 430 660 475 740 542" fill="freeze"/></circle>
      <circle r="8" fill="#F4B740"><animateMotion begin="2.1s" dur="1.3s" path="M1462 392C1330 430 1260 475 1180 542" fill="freeze"/></circle>
      <rect x="770" y="276" width="380" height="66" rx="33" fill="#fff" stroke="#eef1f5"/><text x="960" y="316" text-anchor="middle" class="body">抽取事实 → 对齐能力项 → 归一化</text>
    </g>

    <!-- 统一能力坐标系 -->
    <g opacity="0"><animate attributeName="opacity" begin="2.7s" dur=".5s" to="1" fill="freeze"/>
      <rect x="600" y="370" width="720" height="570" rx="40" fill="#fff" stroke="#eef1f5" filter="url(#shadow)"/>
      <rect x="817" y="392" width="286" height="40" rx="20" fill="#eaf0ff"/><text x="960" y="419" text-anchor="middle" class="small" fill="#2457F5">4 类 × 19 项能力模型</text>
      <g stroke="#dfe6f2" stroke-width="1.4" fill="none"><path d="M950 680L710 754L972 840L1225 754Z"/><path d="M950 680L770 735L972 800L1166 735Z"/><path d="M950 680L830 716L972 760L1105 716Z"/><path d="M950 680L972 840M950 680L710 754M950 680L1225 754M950 680L950 470"/><path d="M950 680L780 824M950 680L1160 824M950 680L760 645M950 680L1180 645M950 680L810 570M950 680L1095 560" opacity=".45"/></g>
      <g stroke="#2457F5" stroke-width="2" fill="none" marker-end="url(#blueArrow)"><path d="M950 680L950 456"/><path d="M950 680L692 758"/><path d="M950 680L970 862"/><path d="M950 680L1244 758"/></g>
      <text x="950" y="456" text-anchor="middle" class="small" font-weight="760">通用能力</text><text x="682" y="756" text-anchor="end" class="small" font-weight="760">专业能力</text><text x="970" y="888" text-anchor="middle" class="small" font-weight="760">行业认知</text><text x="1250" y="758" class="small" font-weight="760">岗位适配</text><circle cx="950" cy="680" r="9" fill="#2457F5"/>
    </g>

    <!-- C 向量 -->
    <g opacity="0"><animate attributeName="opacity" begin="4.4s" dur=".3s" to="1" fill="freeze"/>
      <path d="M950 680L1070 500" stroke="#2457F5" stroke-width="7" stroke-linecap="round" marker-end="url(#blueArrow)" stroke-dasharray="0 220"><animate attributeName="stroke-dasharray" begin="4.4s" dur="1s" from="0 220" to="220 0" fill="freeze"/></path><circle cx="1070" cy="500" r="11" fill="#2457F5"/><rect x="1084" y="462" width="178" height="58" rx="18" fill="#eaf0ff"/><text x="1103" y="487" class="tiny" fill="#2457F5">候选人能力 C</text><text x="1103" y="509" class="small" fill="#2457F5">证据计算值</text>
    </g>
    <!-- R 向量 -->
    <g opacity="0"><animate attributeName="opacity" begin="5.7s" dur=".3s" to="1" fill="freeze"/>
      <path d="M950 680L1210 635" stroke="#F4B740" stroke-width="7" stroke-linecap="round" marker-end="url(#yellowArrow)" stroke-dasharray="0 270"><animate attributeName="stroke-dasharray" begin="5.7s" dur="1s" from="0 270" to="270 0" fill="freeze"/></path><circle cx="1210" cy="635" r="11" fill="#F4B740"/><rect x="1150" y="550" width="164" height="58" rx="18" fill="#fff6dc"/><text x="1168" y="575" class="tiny" fill="#B97900">岗位需求 R</text><text x="1168" y="597" class="small" fill="#B97900">JD 计算值</text>
    </g>
    <!-- Gap -->
    <g opacity="0"><animate attributeName="opacity" begin="7s" dur=".35s" to="1" fill="freeze"/>
      <path d="M1078 507C1140 520 1182 562 1206 624" fill="none" stroke="#E5484D" stroke-width="4" stroke-dasharray="10 9" marker-end="url(#redArrow)"/><rect x="1092" y="523" width="144" height="42" rx="21" fill="#fff1f1" stroke="#ffcaca"/><text x="1164" y="550" text-anchor="middle" class="small" fill="#E5484D">能力 Gap</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" begin="8.05s" dur=".4s" to="1" fill="freeze"/><rect x="682" y="892" width="556" height="52" rx="26" fill="#f4f7ff"/><text x="960" y="925" text-anchor="middle" class="body">同一空间内比较 C 与 R，差距才可解释</text></g>
  </g>

  <!-- 第二幕 9.2—16.6s：排序依据 -->
  <g id="scene2" opacity="0">
    <animate attributeName="opacity" begin="9.2s" dur=".45s" to="1" fill="freeze"/><animate attributeName="opacity" begin="16.25s" dur=".35s" to="0" fill="freeze"/>
    <text x="88" y="145" class="title">② 排序依据，不是一个黑箱分数</text><text x="88" y="184" class="body">三个视角共同解释：为什么这个岗位排在前面？</text>
    <g transform="translate(88 260)">
      <g opacity="0"><animate attributeName="opacity" begin="9.7s" dur=".4s" to="1" fill="freeze"/><rect width="520" height="500" rx="38" fill="#fff" stroke="#eef1f5" filter="url(#shadow)"/><circle cx="62" cy="62" r="26" fill="#eaf0ff"/><text x="62" y="71" text-anchor="middle" class="num" font-size="22" fill="#2457F5">A</text><text x="106" y="72" class="h2">现实匹配优先</text><text x="42" y="132" class="body">现在能不能投？</text><text x="42" y="175" class="small">• 能力覆盖与强度差</text><text x="42" y="211" class="small">• 硬条件是否通过</text><text x="42" y="247" class="small">• 证据可信度与 Gate</text><rect x="42" y="310" width="436" height="18" rx="9" fill="#eef1f5"/><rect x="42" y="310" width="0" height="18" rx="9" fill="#2457F5"><animate attributeName="width" begin="10.2s" dur="1s" from="0" to="350" fill="freeze"/></rect><rect x="42" y="380" width="200" height="54" rx="27" fill="#eaf0ff"/><text x="142" y="414" text-anchor="middle" class="small" fill="#2457F5">更接近可应聘</text></g>
      <g transform="translate(568)" opacity="0"><animate attributeName="opacity" begin="11.4s" dur=".4s" to="1" fill="freeze"/><rect width="520" height="500" rx="38" fill="#fff" stroke="#eef1f5" filter="url(#shadow)"/><circle cx="62" cy="62" r="26" fill="#eaf0ff"/><text x="62" y="71" text-anchor="middle" class="num" font-size="22" fill="#2457F5">B</text><text x="106" y="72" class="h2">发展意愿优先</text><text x="42" y="132" class="body">值不值得长期投入？</text><text x="42" y="175" class="small">• 目标职能与行业偏好</text><text x="42" y="211" class="small">• 可迁移经历与成长路径</text><text x="42" y="247" class="small">• 用户主动选择的方向</text><path d="M64 344C148 270 260 395 438 295" fill="none" stroke="#2457F5" stroke-width="5" stroke-linecap="round"/><circle cx="64" cy="344" r="9" fill="#2457F5"/><circle cx="438" cy="295" r="12" fill="#2457F5"/><rect x="42" y="380" width="200" height="54" rx="27" fill="#eaf0ff"/><text x="142" y="414" text-anchor="middle" class="small" fill="#2457F5">更符合成长方向</text></g>
      <g transform="translate(1136)" opacity="0"><animate attributeName="opacity" begin="13.1s" dur=".4s" to="1" fill="freeze"/><rect width="520" height="500" rx="38" fill="#fff" stroke="#f5dfaa" filter="url(#shadow)"/><circle cx="62" cy="62" r="26" fill="#fff6dc"/><text x="62" y="71" text-anchor="middle" class="num" font-size="22" fill="#B97900">C</text><text x="106" y="72" class="h2">城市·薪资等约束</text><text x="42" y="132" class="body">现实上是否可接受？</text><text x="42" y="175" class="small">• 城市与工作方式</text><text x="42" y="211" class="small">• 薪资与入职时间</text><text x="42" y="247" class="small">• 其他必须满足的条件</text><g transform="translate(42 302)"><rect width="122" height="46" rx="23" fill="#fff6dc"/><text x="61" y="29" text-anchor="middle" class="small" fill="#B97900">城市 Gate</text><rect x="136" width="122" height="46" rx="23" fill="#fff6dc"/><text x="197" y="29" text-anchor="middle" class="small" fill="#B97900">薪资 Gate</text></g><rect x="42" y="380" width="200" height="54" rx="27" fill="#fff6dc"/><text x="142" y="414" text-anchor="middle" class="small" fill="#B97900">更符合现实约束</text></g>
    </g>
    <g opacity="0"><animate attributeName="opacity" begin="14.8s" dur=".4s" to="1" fill="freeze"/><path d="M350 822H1570" stroke="#2457F5" stroke-width="4" stroke-dasharray="10 12"/><rect x="690" y="790" width="540" height="66" rx="33" fill="#2457F5"/><text x="960" y="832" text-anchor="middle" class="body" fill="#fff">按用户当前优先级，形成可解释排序</text></g>
  </g>

  <!-- 第三幕 16.3—24.5s：从冗余选项到短期目标 -->
  <g id="scene3" opacity="0">
    <animate attributeName="opacity" begin="16.3s" dur=".45s" to="1" fill="freeze"/>
    <text x="88" y="145" class="title">③ 从职业选项噪声，到清晰的短期目标</text><text x="88" y="184" class="body">产品不是替用户做决定，而是把选择变成可理解、可模拟、可行动的过程</text>
    <!-- 左侧冗杂选项 -->
    <g opacity="0"><animate attributeName="opacity" begin="16.7s" dur=".45s" to="1" fill="freeze"/>
      <rect x="88" y="270" width="500" height="620" rx="38" fill="#fff" stroke="#eef1f5" filter="url(#shadow)"/><text x="130" y="330" class="h2">大量职业选项</text><text x="130" y="365" class="small">看起来都可以，却不知道先做什么</text>
      <g class="small"><g transform="translate(130 410)"><rect width="150" height="50" rx="25" fill="#f4f6fa"/><text x="75" y="32" text-anchor="middle">产品运营</text></g><g transform="translate(300 410)"><rect width="160" height="50" rx="25" fill="#f4f6fa"/><text x="80" y="32" text-anchor="middle">商业分析</text></g><g transform="translate(170 480)"><rect width="150" height="50" rx="25" fill="#f4f6fa"/><text x="75" y="32" text-anchor="middle">数据运营</text></g><g transform="translate(338 480)"><rect width="120" height="50" rx="25" fill="#f4f6fa"/><text x="60" y="32" text-anchor="middle">咨询</text></g><g transform="translate(116 550)"><rect width="150" height="50" rx="25" fill="#f4f6fa"/><text x="75" y="32" text-anchor="middle">行业研究</text></g><g transform="translate(286 550)"><rect width="170" height="50" rx="25" fill="#f4f6fa"/><text x="85" y="32" text-anchor="middle">用户增长</text></g><g transform="translate(155 620)"><rect width="180" height="50" rx="25" fill="#f4f6fa"/><text x="90" y="32" text-anchor="middle">项目管理</text></g><g transform="translate(350 620)"><rect width="120" height="50" rx="25" fill="#f4f6fa"/><text x="60" y="32" text-anchor="middle">销售</text></g><g transform="translate(118 690)"><rect width="170" height="50" rx="25" fill="#f4f6fa"/><text x="85" y="32" text-anchor="middle">市场策略</text></g><g transform="translate(306 690)"><rect width="150" height="50" rx="25" fill="#f4f6fa"/><text x="75" y="32" text-anchor="middle">客户成功</text></g></g>
      <text x="338" y="825" text-anchor="middle" class="h2" fill="#8b96aa">？</text>
    </g>
    <!-- 产品推算引擎 -->
    <g opacity="0"><animate attributeName="opacity" begin="18s" dur=".4s" to="1" fill="freeze"/>
      <path d="M588 580H680" stroke="#2457F5" stroke-width="5" marker-end="url(#blueArrow)"/>
      <rect x="690" y="270" width="540" height="620" rx="40" fill="#fff" stroke="#eef1f5" filter="url(#shadow)"/><rect x="800" y="300" width="320" height="44" rx="22" fill="#eaf0ff"/><text x="960" y="329" text-anchor="middle" class="small" fill="#2457F5">产品推算与讲解</text>
      <g transform="translate(742 390)"><circle cx="34" cy="34" r="34" fill="#eaf0ff"/><text x="34" y="43" text-anchor="middle" class="num" font-size="22" fill="#2457F5">1</text><text x="90" y="28" class="h3">推算</text><text x="90" y="56" class="small">比较能力、意愿与约束</text></g>
      <g transform="translate(742 505)" opacity="0"><animate attributeName="opacity" begin="18.8s" dur=".35s" to="1" fill="freeze"/><circle cx="34" cy="34" r="34" fill="#eaf0ff"/><text x="34" y="43" text-anchor="middle" class="num" font-size="22" fill="#2457F5">2</text><text x="90" y="28" class="h3">讲解岗位</text><text x="90" y="56" class="small">说明工作内容与推荐理由</text></g>
      <g transform="translate(742 620)" opacity="0"><animate attributeName="opacity" begin="19.6s" dur=".35s" to="1" fill="freeze"/><circle cx="34" cy="34" r="34" fill="#eaf0ff"/><text x="34" y="43" text-anchor="middle" class="num" font-size="22" fill="#2457F5">3</text><text x="90" y="28" class="h3">多情境模拟</text><text x="90" y="56" class="small">改变城市、方向或补强计划</text></g>
      <g transform="translate(742 735)" opacity="0"><animate attributeName="opacity" begin="20.4s" dur=".35s" to="1" fill="freeze"/><circle cx="34" cy="34" r="34" fill="#fff1f1"/><text x="34" y="43" text-anchor="middle" class="num" font-size="22" fill="#E5484D">4</text><text x="90" y="28" class="h3">Gap 准备清单</text><text x="90" y="56" class="small">把差距转成可执行的准备项</text></g>
    </g>
    <!-- 目标输出 -->
    <g opacity="0"><animate attributeName="opacity" begin="21.3s" dur=".45s" to="1" fill="freeze"/>
      <path d="M1230 580H1322" stroke="#2457F5" stroke-width="5" marker-end="url(#blueArrow)"/>
      <rect x="1332" y="318" width="500" height="520" rx="42" fill="#fff" stroke="#cddafe" stroke-width="2" filter="url(#shadow)"/><circle cx="1582" cy="428" r="68" fill="#eaf0ff"/><path d="M1548 430l24 24 48-58" fill="none" stroke="#2457F5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/><text x="1582" y="545" text-anchor="middle" class="small" fill="#2457F5">当前可行动的答案</text><text x="1582" y="595" text-anchor="middle" class="h2">一个清晰的短期目标</text><text x="1582" y="635" text-anchor="middle" class="body">优先准备最合适的岗位方向</text>
      <g opacity="0"><animate attributeName="opacity" begin="22.2s" dur=".4s" to="1" fill="freeze"/><rect x="1410" y="692" width="344" height="76" rx="24" fill="#f4f7ff"/><text x="1435" y="721" class="tiny">下一步</text><text x="1435" y="750" class="small" fill="#2457F5">按 Gap 清单开始准备与验证</text></g>
    </g>
    <g opacity="0"><animate attributeName="opacity" begin="23.25s" dur=".4s" to="1" fill="freeze"/><rect x="670" y="936" width="580" height="58" rx="29" fill="#2457F5"/><text x="960" y="973" text-anchor="middle" class="body" fill="#fff">从“选项很多”，走到“下一步清楚”</text></g>
  </g>

  <!-- 全局进度 -->
  <rect y="1074" width="1920" height="6" fill="#e9edf5"/><rect y="1074" width="0" height="6" fill="#2457F5"><animate attributeName="width" dur="24.5s" from="0" to="1920" fill="freeze"/></rect>
</svg>
